<svg viewBox="0 0 1150 1080" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1150" height="1080" fill="#FFFFFF"/>
  <text x="575" y="36" text-anchor="middle" font-size="26" font-weight="700" fill="#000000">Sequence Diagram &#8212; ATM Cash Withdrawal</text>

  <defs>
    <marker id="solidArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#000000"/>
    </marker>
    <marker id="openArrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L11,6 L0,12" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Lifeline headers -->
  <!-- Customer = actor -->
  <g stroke="#000000" stroke-width="2" fill="none">
    <circle cx="150" cy="70" r="12" fill="#FFFFFF"/>
    <line x1="150" y1="82" x2="150" y2="110"/>
    <line x1="130" y1="92" x2="170" y2="92"/>
    <line x1="150" y1="110" x2="132" y2="132"/>
    <line x1="150" y1="110" x2="168" y2="132"/>
  </g>
  <text x="150" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#000000">Customer</text>

  <g font-size="15" font-weight="700" fill="#FFC904">
    <rect x="365" y="65" width="110" height="42" fill="#000000"/>
    <text x="420" y="92" text-anchor="middle">ATM</text>

    <rect x="620" y="65" width="140" height="42" fill="#000000"/>
    <text x="690" y="92" text-anchor="middle">Bank Server</text>

    <rect x="890" y="65" width="150" height="42" fill="#000000"/>
    <text x="965" y="92" text-anchor="middle">Bank Account</text>
  </g>

  <!-- Lifelines (dashed) -->
  <g stroke="#BA9B37" stroke-width="1.5" stroke-dasharray="5,5">
    <line x1="150" y1="152" x2="150" y2="1040"/>
    <line x1="420" y1="107" x2="420" y2="1040"/>
    <line x1="690" y1="107" x2="690" y2="1040"/>
    <line x1="965" y1="107" x2="965" y2="1040"/>
  </g>

  <!-- Messages: card verification -->
  <g font-size="13" fill="#000000">
    <line x1="150" y1="150" x2="415" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#solidArrow)"/>
    <text x="160" y="142">1: insertCard()</text>

    <line x1="425" y1="180" x2="685" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#solidArrow)"/>
    <text x="435" y="172">2: verifyCard(cardNumber)</text>

    <line x1="695" y1="210" x2="960" y2="210" stroke="#000000" stroke-width="2" marker-end="url(#solidArrow)"/>
    <text x="705" y="202">3: checkCardValid()</text>

    <line x1="960" y1="240" x2="695" y2="240" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#openArrow2)"/>
    <text x="705" y="233">4: valid (return)</text>

    <line x1="685" y1="270" x2="425" y2="270" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#openArrow2)"/>
    <text x="435" y="263">5: cardOK (return)</text>
  </g>

  <!-- ALT frame 1: card valid / invalid -->
  <rect x="110" y="300" width="900" height="270" fill="none" stroke="#000000" stroke-width="2"/>
  <path d="M110,300 h60 v18 l-10,10 h-50 z" fill="#FFF7DA" stroke="#000000" stroke-width="1.5"/>
  <text x="122" y="314" font-size="12" font-weight="700" fill="#000000">alt</text>
  <text x="200" y="325" font-size="13" font-style="italic" fill="#000000">[card valid]</text>

  <g font-size="13" fill="#000000">
    <line x1="150" y1="350" x2="415" y2="350" stroke="#000000" stroke-width="2" marker-end="url(#solidArrow)"/>
    <text x="160" y="342">6: requestPIN() [dotted response, not a return]</text>

    <line x1="150" y1="385" x2="415" y2="385" stroke="#000000" stroke-width="2" marker-end="url(#solidArrow)"/>
    <text x="160" y="378">7: enterPIN(pin)</text>

    <line x1="425" y1="415" x2="685" y2="415" stroke="#000000" stroke-width="2" marker-end="url(#solidArrow)"/>
    <text x="435" y="407">8: verifyPIN(pin)</text>

    <line x1="685" y1="445" x2="425" y2="445" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#openArrow2)"/>
    <text x="435" y="438">9: pinOK (return)</text>
  </g>

  <line x1="110" y1="475" x2="1010" y2="475" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="200" y="495" font-size="13" font-style="italic" fill="#000000">[card invalid]</text>
  <g font-size="13" fill="#000000">
    <line x1="425" y1="530" x2="155" y2="530" stroke="#000000" stroke-width="2" marker-end="url(#solidArrow)"/>
    <text x="200" y="522">6b: ejectCard() &#8212; transaction ends</text>
  </g>

  <!-- ALT frame 2: funds sufficient / insufficient -->
  <rect x="110" y="610" width="900" height="290" fill="none" stroke="#000000" stroke-width="2"/>
  <path d="M110,610 h60 v18 l-10,10 h-50 z" fill="#FFF7DA" stroke="#000000" stroke-width="1.5"/>
  <text x="122" y="624" font-size="12" font-weight="700" fill="#000000">alt</text>
  <text x="200" y="635" font-size="13" font-style="italic" fill="#000000">[funds sufficient]</text>

  <g font-size="13" fill="#000000">
    <line x1="425" y1="660" x2="685" y2="660" stroke="#000000" stroke-width="2" marker-end="url(#solidArrow)"/>
    <text x="435" y="652">10: withdraw(amount)</text>

    <line x1="695" y1="690" x2="960" y2="690" stroke="#000000" stroke-width="2" marker-end="url(#solidArrow)"/>
    <text x="705" y="682">11: debit(amount)</text>

    <line x1="960" y1="720" x2="695" y2="720" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#openArrow2)"/>
    <text x="705" y="713">12: ok (return)</text>

    <line x1="685" y1="750" x2="425" y2="750" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#openArrow2)"/>
    <text x="435" y="743">13: cashReady (return)</text>

    <line x1="415" y1="780" x2="155" y2="780" stroke="#000000" stroke-width="2" marker-end="url(#solidArrow)"/>
    <text x="200" y="772">14: dispenseCash()</text>
  </g>

  <line x1="110" y1="810" x2="1010" y2="810" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="200" y="830" font-size="13" font-style="italic" fill="#000000">[funds insufficient]</text>
  <g font-size="13" fill="#000000">
    <line x1="685" y1="860" x2="425" y2="860" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#openArrow2)"/>
    <text x="435" y="853">10b: insufficientFunds (return)</text>
    <line x1="415" y1="885" x2="155" y2="885" stroke="#000000" stroke-width="2" marker-end="url(#solidArrow)"/>
    <text x="200" y="877">11b: displayError()</text>
  </g>

  <!-- Final: eject card -->
  <g font-size="13" fill="#000000">
    <line x1="415" y1="950" x2="155" y2="950" stroke="#000000" stroke-width="2" marker-end="url(#solidArrow)"/>
    <text x="220" y="942">15: ejectCard()</text>
  </g>

  <text x="575" y="1000" text-anchor="middle" font-size="13" fill="#BA9B37" font-style="italic">Solid arrows = calls &#8226; dashed arrows = returns &#8226; "alt" frames = mutually exclusive branches</text>
</svg>
