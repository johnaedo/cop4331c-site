<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#FFFFFF"/>

  <text x="600" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#000000">Waterfall vs. Agile</text>

  <!-- WATERFALL -->
  <text x="60" y="95" font-size="22" font-weight="700" fill="#000000">Waterfall &#8212; Linear</text>
  <g font-size="15" font-weight="600" text-anchor="middle" fill="#FFFFFF">
    <rect x="60"  y="115" width="150" height="60" fill="#000000"/>
    <text x="135" y="150">Requirements</text>
    <rect x="230" y="115" width="150" height="60" fill="#000000"/>
    <text x="305" y="150">Design</text>
    <rect x="400" y="115" width="150" height="60" fill="#000000"/>
    <text x="475" y="150">Implementation</text>
    <rect x="570" y="115" width="150" height="60" fill="#000000"/>
    <text x="645" y="150">Testing</text>
    <rect x="740" y="115" width="150" height="60" fill="#000000"/>
    <text x="815" y="150">Deployment</text>
  </g>
  <g stroke="#000000" stroke-width="3" fill="none">
    <line x1="210" y1="145" x2="228" y2="145" marker-end="url(#arw)"/>
    <line x1="380" y1="145" x2="398" y2="145" marker-end="url(#arw)"/>
    <line x1="550" y1="145" x2="568" y2="145" marker-end="url(#arw)"/>
    <line x1="720" y1="145" x2="738" y2="145" marker-end="url(#arw)"/>
  </g>
  <text x="60" y="210" font-size="15" fill="#000000">✓ Simple, well-defined stages   ✓ Best for stable, well-understood requirements</text>
  <text x="60" y="232" font-size="15" fill="#000000">✗ Rigid &#8212; changes are difficult and expensive once a phase is complete</text>

  <!-- divider -->
  <line x1="40" y1="265" x2="1160" y2="265" stroke="#BA9B37" stroke-width="2"/>

  <!-- AGILE -->
  <text x="60" y="305" font-size="22" font-weight="700" fill="#000000">Agile &#8212; Iterative Sprints</text>

  <!-- 3 sprint cycles -->
  <g>
    <!-- Sprint 1 -->
    <circle cx="200" cy="400" r="80" fill="none" stroke="#BA9B37" stroke-width="4"/>
    <text x="200" y="395" text-anchor="middle" font-size="16" font-weight="700" fill="#000000">Sprint 1</text>
    <text x="200" y="416" text-anchor="middle" font-size="13" fill="#000000">plan &#8226; build</text>
    <text x="200" y="432" text-anchor="middle" font-size="13" fill="#000000">test &#8226; review</text>

    <!-- Sprint 2 -->
    <circle cx="440" cy="400" r="80" fill="none" stroke="#BA9B37" stroke-width="4"/>
    <text x="440" y="395" text-anchor="middle" font-size="16" font-weight="700" fill="#000000">Sprint 2</text>
    <text x="440" y="416" text-anchor="middle" font-size="13" fill="#000000">plan &#8226; build</text>
    <text x="440" y="432" text-anchor="middle" font-size="13" fill="#000000">test &#8226; review</text>

    <!-- Sprint 3 -->
    <circle cx="680" cy="400" r="80" fill="none" stroke="#BA9B37" stroke-width="4"/>
    <text x="680" y="395" text-anchor="middle" font-size="16" font-weight="700" fill="#000000">Sprint 3</text>
    <text x="680" y="416" text-anchor="middle" font-size="13" fill="#000000">plan &#8226; build</text>
    <text x="680" y="432" text-anchor="middle" font-size="13" fill="#000000">test &#8226; review</text>

    <text x="900" y="392" font-size="16" fill="#000000">...more</text>
    <text x="900" y="414" font-size="16" fill="#000000">sprints,</text>
    <text x="900" y="436" font-size="16" fill="#000000">shippable</text>
    <text x="900" y="458" font-size="16" fill="#000000">each time</text>

    <g stroke="#000000" stroke-width="3" fill="none">
      <line x1="282" y1="400" x2="358" y2="400" marker-end="url(#arw)"/>
      <line x1="522" y1="400" x2="598" y2="400" marker-end="url(#arw)"/>
      <line x1="762" y1="400" x2="850" y2="400" marker-end="url(#arw)"/>
    </g>
  </g>

  <text x="60" y="500" font-size="15" fill="#000000">✓ Flexible, adapts to change   ✓ Continuous customer feedback   ✓ Best when requirements will evolve</text>
  <text x="60" y="522" font-size="15" fill="#000000">✗ Less predictable final timeline and feature set</text>
</svg>
