<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#BA9B37"/>
    </marker>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="460" fill="#FFFFFF"/>

  <!-- Phase boxes -->
  <!-- 6 phases evenly spaced -->
  <!-- box width 160, gap 26 -->
  <g font-size="22" font-weight="700" text-anchor="middle">
    <!-- 1 Requirements -->
    <rect x="20" y="140" width="160" height="140" rx="10" fill="#000000"/>
    <text x="100" y="200" fill="#FFC904">Require-</text>
    <text x="100" y="228" fill="#FFC904">ments</text>
    <text x="100" y="258" font-size="14" fill="#FFFFFF" font-weight="400">What are we</text>
    <text x="100" y="276" font-size="14" fill="#FFFFFF" font-weight="400">building?</text>

    <!-- 2 Design -->
    <rect x="206" y="140" width="160" height="140" rx="10" fill="#000000"/>
    <text x="286" y="210" fill="#FFC904">Design</text>
    <text x="286" y="240" font-size="14" fill="#FFFFFF" font-weight="400">How will we</text>
    <text x="286" y="258" font-size="14" fill="#FFFFFF" font-weight="400">build it?</text>

    <!-- 3 Implementation -->
    <rect x="392" y="140" width="160" height="140" rx="10" fill="#000000"/>
    <text x="472" y="200" fill="#FFC904">Implemen-</text>
    <text x="472" y="228" fill="#FFC904">tation</text>
    <text x="472" y="258" font-size="14" fill="#FFFFFF" font-weight="400">Writing the</text>
    <text x="472" y="276" font-size="14" fill="#FFFFFF" font-weight="400">code</text>

    <!-- 4 Testing -->
    <rect x="578" y="140" width="160" height="140" rx="10" fill="#000000"/>
    <text x="658" y="210" fill="#FFC904">Testing</text>
    <text x="658" y="240" font-size="14" fill="#FFFFFF" font-weight="400">Does it work</text>
    <text x="658" y="258" font-size="14" fill="#FFFFFF" font-weight="400">correctly?</text>

    <!-- 5 Deployment -->
    <rect x="764" y="140" width="160" height="140" rx="10" fill="#000000"/>
    <text x="844" y="200" fill="#FFC904">Deploy-</text>
    <text x="844" y="228" fill="#FFC904">ment</text>
    <text x="844" y="258" font-size="14" fill="#FFFFFF" font-weight="400">Going live</text>

    <!-- 6 Maintenance -->
    <rect x="950" y="140" width="230" height="140" rx="10" fill="#BA9B37"/>
    <text x="1065" y="200" fill="#000000">Mainte-</text>
    <text x="1065" y="228" fill="#000000">nance</text>
    <text x="1065" y="258" font-size="14" fill="#000000" font-weight="400">Keeping it running</text>
    <text x="1065" y="276" font-size="14" fill="#000000" font-weight="400">(the longest phase)</text>
  </g>

  <!-- Connecting arrows -->
  <g stroke="#000000" stroke-width="4" fill="none">
    <line x1="180" y1="210" x2="204" y2="210" marker-end="url(#arrowBlack)"/>
    <line x1="366" y1="210" x2="390" y2="210" marker-end="url(#arrowBlack)"/>
    <line x1="552" y1="210" x2="576" y2="210" marker-end="url(#arrowBlack)"/>
    <line x1="738" y1="210" x2="762" y2="210" marker-end="url(#arrowBlack)"/>
    <line x1="924" y1="210" x2="948" y2="210" marker-end="url(#arrowBlack)"/>
  </g>

  <!-- Feedback loop from Maintenance back to Requirements -->
  <path d="M 1065 280 L 1065 340 L 100 340 L 100 282" fill="none" stroke="#BA9B37" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrowGold)"/>
  <text x="580" y="365" text-anchor="middle" font-size="16" fill="#BA9B37" font-style="italic">requirements evolve &#8212; the cycle continues</text>

  <!-- Title -->
  <text x="600" y="60" text-anchor="middle" font-size="30" font-weight="700" fill="#000000">The Software Development Life Cycle (SDLC)</text>
  <text x="600" y="95" text-anchor="middle" font-size="18" fill="#BA9B37">A structured roadmap from idea to a working, maintained product</text>
</svg>
