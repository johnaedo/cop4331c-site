<svg viewBox="0 0 1150 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1150" height="700" fill="#FFFFFF"/>
  <text x="575" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#000000">Class Relationships &#8212; The Zoo System</text>

  <defs>
    <!-- hollow diamond for aggregation -->
    <marker id="diaHollow" markerWidth="26" markerHeight="16" refX="24" refY="8" orient="auto">
      <path d="M0,8 L13,1 L26,8 L13,15 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    </marker>
    <!-- filled diamond for composition -->
    <marker id="diaFilled" markerWidth="26" markerHeight="16" refX="24" refY="8" orient="auto">
      <path d="M0,8 L13,1 L26,8 L13,15 Z" fill="#000000" stroke="#000000" stroke-width="2"/>
    </marker>
    <!-- hollow triangle for generalization -->
    <marker id="triHollow" markerWidth="22" markerHeight="18" refX="20" refY="9" orient="auto">
      <path d="M0,0 L20,9 L0,18 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    </marker>
    <!-- open arrow for dependency -->
    <marker id="openArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L12,7 L0,14" fill="none" stroke="#000000" stroke-width="2"/>
    </marker>
  </defs>

  <!-- helper: simple class box function via repeated rects -->
  <!-- Zoo -->
  <rect x="500" y="70" width="150" height="60" fill="#000000"/>
  <text x="575" y="107" text-anchor="middle" font-size="18" font-weight="700" fill="#FFC904">Zoo</text>

  <!-- Zookeeper (association) -->
  <rect x="230" y="70" width="160" height="60" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
  <text x="310" y="107" text-anchor="middle" font-size="17" fill="#000000">Zookeeper</text>
  <line x1="390" y1="100" x2="498" y2="100" stroke="#000000" stroke-width="2.5"/>
  <text x="440" y="90" text-anchor="middle" font-size="13" fill="#000000">employs</text>
  <text x="345" y="150" text-anchor="middle" font-size="12" fill="#BA9B37">association &#8212; a plain line</text>

  <!-- Enclosure (aggregation, hollow diamond at Zoo) -->
  <rect x="770" y="70" width="160" height="60" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
  <text x="850" y="107" text-anchor="middle" font-size="17" fill="#000000">Enclosure</text>
  <line x1="650" y1="100" x2="768" y2="100" stroke="#000000" stroke-width="2.5" marker-start="url(#diaHollow)"/>
  <text x="800" y="150" text-anchor="middle" font-size="12" fill="#BA9B37">aggregation &#8212; hollow diamond, "has-a"</text>
  <text x="800" y="166" text-anchor="middle" font-size="12" fill="#BA9B37">(enclosure can outlive the zoo)</text>

  <!-- FeedingSchedule (dependency, dashed open arrow from Zookeeper) -->
  <rect x="20" y="230" width="180" height="60" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5" stroke-dasharray="2,0"/>
  <text x="110" y="267" text-anchor="middle" font-size="16" fill="#000000">FeedingSchedule</text>
  <path d="M 240 200 L 130 228" stroke="#000000" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#openArrow)" fill="none"/>
  <text x="120" y="185" text-anchor="middle" font-size="12" fill="#BA9B37">dependency &#8212;</text>
  <text x="120" y="200" text-anchor="middle" font-size="12" fill="#BA9B37">dashed arrow, "uses"</text>

  <!-- Cage (composition, filled diamond at Zoo) -->
  <rect x="500" y="230" width="150" height="60" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
  <text x="575" y="267" text-anchor="middle" font-size="17" fill="#000000">Cage</text>
  <line x1="575" y1="132" x2="575" y2="228" stroke="#000000" stroke-width="2.5" marker-start="url(#diaFilled)"/>
  <text x="700" y="185" text-anchor="middle" font-size="12" fill="#BA9B37">composition &#8212; filled diamond,</text>
  <text x="700" y="200" text-anchor="middle" font-size="12" fill="#BA9B37">"owns" (cage is destroyed with the zoo)</text>

  <!-- divider -->
  <line x1="60" y1="345" x2="1090" y2="345" stroke="#BA9B37" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="575" y="368" text-anchor="middle" font-size="13" fill="#BA9B37" font-style="italic">separately: the Animal generalization hierarchy</text>

  <!-- Animal base class -->
  <rect x="480" y="400" width="190" height="60" fill="#000000"/>
  <text x="575" y="437" text-anchor="middle" font-size="18" font-weight="700" fill="#FFC904">Animal</text>
  <!-- Subclasses: generalization -->
  <rect x="280" y="560" width="150" height="60" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
  <text x="355" y="597" text-anchor="middle" font-size="16" fill="#000000">Lion</text>

  <rect x="500" y="560" width="150" height="60" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
  <text x="575" y="597" text-anchor="middle" font-size="16" fill="#000000">Tortoise</text>

  <rect x="720" y="560" width="150" height="60" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
  <text x="795" y="597" text-anchor="middle" font-size="16" fill="#000000">Bird</text>

  <g stroke="#000000" stroke-width="2">
    <line x1="355" y1="560" x2="565" y2="450" marker-end="url(#triHollow)"/>
    <line x1="575" y1="560" x2="575" y2="462"/>
    <line x1="795" y1="560" x2="590" y2="450" marker-end="url(#triHollow)"/>
  </g>
  <text x="575" y="655" text-anchor="middle" font-size="13" fill="#BA9B37">generalization / inheritance &#8212; hollow triangle points to the parent, "is-a"</text>
  <text x="575" y="675" text-anchor="middle" font-size="13" fill="#000000" font-style="italic">A Tortoise can leave the enclosure and still be a Tortoise &#8212; a strong is-a relationship</text>
</svg>
