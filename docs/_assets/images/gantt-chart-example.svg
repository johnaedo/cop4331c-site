<svg viewBox="0 0 1100 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1100" height="480" fill="#FFFFFF"/>
  <text x="550" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#000000">Example Gantt Chart &#8212; Course Project</text>

  <!-- time scale: weeks 1-8 -->
  <!-- grid area x: 260 to 1060, 8 columns of 100 -->
  <g font-size="14" fill="#000000">
    <text x="80" y="75" font-weight="700">Task</text>
    <text x="1050" y="75" font-weight="700" text-anchor="end">Week &#8594;</text>
  </g>

  <!-- week headers -->
  <g font-size="13" text-anchor="middle" fill="#000000">
    <text x="310" y="95">1</text><text x="410" y="95">2</text><text x="510" y="95">3</text>
    <text x="610" y="95">4</text><text x="710" y="95">5</text><text x="810" y="95">6</text>
    <text x="910" y="95">7</text><text x="1010" y="95">8</text>
  </g>
  <line x1="260" y1="105" x2="1060" y2="105" stroke="#000000" stroke-width="1"/>

  <!-- vertical gridlines -->
  <g stroke="#BA9B37" stroke-width="1" opacity="0.5">
    <line x1="260" y1="105" x2="260" y2="440"/>
    <line x1="360" y1="105" x2="360" y2="440"/>
    <line x1="460" y1="105" x2="460" y2="440"/>
    <line x1="560" y1="105" x2="560" y2="440"/>
    <line x1="660" y1="105" x2="660" y2="440"/>
    <line x1="760" y1="105" x2="760" y2="440"/>
    <line x1="860" y1="105" x2="860" y2="440"/>
    <line x1="960" y1="105" x2="960" y2="440"/>
    <line x1="1060" y1="105" x2="1060" y2="440"/>
  </g>

  <!-- rows: 5 tasks -->
  <g font-size="15" fill="#000000">
    <text x="20" y="140">Requirements</text>
    <text x="20" y="185">Design</text>
    <text x="20" y="230">Implementation</text>
    <text x="20" y="275">Testing</text>
    <text x="20" y="320">Deployment</text>
  </g>
  <g stroke="#e0e0e0">
    <line x1="20" y1="115" x2="1060" y2="115"/>
    <line x1="20" y1="160" x2="1060" y2="160"/>
    <line x1="20" y1="205" x2="1060" y2="205"/>
    <line x1="20" y1="250" x2="1060" y2="250"/>
    <line x1="20" y1="295" x2="1060" y2="295"/>
    <line x1="20" y1="340" x2="1060" y2="340"/>
  </g>

  <!-- bars: position/length reflect start, duration, end -->
  <g>
    <rect x="260" y="120" width="200" height="30" rx="5" fill="#000000"/>
    <rect x="440" y="165" width="200" height="30" rx="5" fill="#BA9B37"/>
    <rect x="560" y="210" width="300" height="30" rx="5" fill="#000000"/>
    <rect x="760" y="255" width="200" height="30" rx="5" fill="#BA9B37"/>
    <rect x="960" y="300" width="100" height="30" rx="5" fill="#FFC904" stroke="#000000" stroke-width="1"/>
  </g>

  <!-- overlap callout -->
  <path d="M 560 240 L 560 355" stroke="#FFC904" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 640 240 L 640 355" stroke="#FFC904" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="600" y="372" text-anchor="middle" font-size="13" fill="#000000">tasks can overlap</text>

  <!-- legend / callouts -->
  <g font-size="14" fill="#000000">
    <circle cx="260" cy="405" r="5" fill="#000000"/>
    <text x="275" y="410">bar position = start date</text>
    <circle cx="530" cy="405" r="5" fill="#000000"/>
    <text x="545" y="410">bar length = duration</text>
    <circle cx="770" cy="405" r="5" fill="#000000"/>
    <text x="785" y="410">bar end = due date</text>
  </g>
  <text x="550" y="450" text-anchor="middle" font-size="14" fill="#BA9B37" font-style="italic">At a glance: what&#8217;s active, what&#8217;s upcoming, and whether the project is on schedule</text>
</svg>
