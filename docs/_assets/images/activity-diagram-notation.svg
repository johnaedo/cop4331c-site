<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="700" fill="#FFFFFF"/>
  <text x="500" y="36" text-anchor="middle" font-size="26" font-weight="700" fill="#000000">Activity Diagram Notation</text>

  <defs>
    <marker id="aArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Start marker -->
  <circle cx="380" cy="75" r="13" fill="#000000"/>
  <text x="420" y="80" font-size="14" fill="#BA9B37">&#8592; start marker (solid ball)</text>

  <line x1="380" y1="88" x2="380" y2="120" stroke="#000000" stroke-width="2" marker-end="url(#aArrow)"/>

  <!-- Activity 1 -->
  <rect x="290" y="125" width="180" height="48" rx="24" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="380" y="155" text-anchor="middle" font-size="15" fill="#000000">Activity1()</text>
  <text x="490" y="155" font-size="14" fill="#BA9B37">&#8592; action / activity state</text>

  <line x1="380" y1="173" x2="380" y2="205" stroke="#000000" stroke-width="2" marker-end="url(#aArrow)"/>

  <!-- Decision diamond -->
  <polygon points="380,210 435,250 380,290 325,250" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="700" y="230" font-size="14" fill="#BA9B37">&#8592; decision (diamond),</text>
  <text x="700" y="248" font-size="14" fill="#BA9B37">&#160;&#160;one path taken</text>

  <!-- 3 branches -->
  <line x1="325" y1="250" x2="170" y2="250" stroke="#000000" stroke-width="2" marker-end="url(#aArrow)"/>
  <text x="215" y="240" font-size="12" fill="#000000">[x&lt;0]</text>
  <line x1="380" y1="290" x2="380" y2="330" stroke="#000000" stroke-width="2" marker-end="url(#aArrow)"/>
  <text x="395" y="315" font-size="12" fill="#000000">[x=0]</text>
  <line x1="435" y1="250" x2="590" y2="250" stroke="#000000" stroke-width="2" marker-end="url(#aArrow)"/>
  <text x="490" y="240" font-size="12" fill="#000000">[x&gt;0]</text>

  <rect x="60" y="255" width="150" height="45" rx="22" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="135" y="283" text-anchor="middle" font-size="13" fill="#000000">Handle Negative</text>
  <rect x="550" y="255" width="150" height="45" rx="22" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="625" y="283" text-anchor="middle" font-size="13" fill="#000000">Handle Positive</text>

  <!-- merge back -->
  <line x1="135" y1="300" x2="135" y2="360" stroke="#000000" stroke-width="2"/>
  <line x1="135" y1="360" x2="372" y2="360" stroke="#000000" stroke-width="2"/>
  <line x1="625" y1="300" x2="625" y2="360" stroke="#000000" stroke-width="2"/>
  <line x1="625" y1="360" x2="388" y2="360" stroke="#000000" stroke-width="2"/>
  <line x1="380" y1="330" x2="380" y2="360" stroke="#000000" stroke-width="2"/>
  <circle cx="380" cy="360" r="4" fill="#000000"/>
  <line x1="380" y1="364" x2="380" y2="405" stroke="#000000" stroke-width="2" marker-end="url(#aArrow)"/>

  <!-- Fork bar -->
  <rect x="260" y="410" width="240" height="10" fill="#000000"/>
  <text x="520" y="419" font-size="14" fill="#BA9B37">&#8592; fork (thick bar), parallel paths begin</text>

  <line x1="310" y1="420" x2="310" y2="460" stroke="#000000" stroke-width="2" marker-end="url(#aArrow)"/>
  <line x1="450" y1="420" x2="450" y2="460" stroke="#000000" stroke-width="2" marker-end="url(#aArrow)"/>

  <rect x="210" y="465" width="200" height="50" rx="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="310" y="496" text-anchor="middle" font-size="14" fill="#000000">Log Transaction</text>

  <rect x="430" y="465" width="200" height="50" rx="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="530" y="496" text-anchor="middle" font-size="14" fill="#000000">Send Receipt</text>

  <line x1="310" y1="515" x2="310" y2="555" stroke="#000000" stroke-width="2"/>
  <line x1="530" y1="515" x2="530" y2="555" stroke="#000000" stroke-width="2"/>

  <!-- Join bar -->
  <rect x="260" y="555" width="320" height="10" fill="#000000"/>
  <text x="600" y="564" font-size="14" fill="#BA9B37">&#8592; join, waits for both then continues</text>

  <line x1="420" y1="565" x2="420" y2="615" stroke="#000000" stroke-width="2" marker-end="url(#aArrow)"/>

  <!-- Stop marker -->
  <circle cx="420" cy="650" r="16" fill="none" stroke="#000000" stroke-width="2.5"/>
  <circle cx="420" cy="650" r="9" fill="#000000"/>
  <text x="460" y="656" font-size="14" fill="#BA9B37">&#8592; stop marker (ball inside a ring)</text>
</svg>
