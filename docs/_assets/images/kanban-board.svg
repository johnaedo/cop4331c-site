<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="560" fill="#FFFFFF"/>
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#000000">Kanban Board (Trello-style)</text>
  <text x="500" y="68" text-anchor="middle" font-size="15" fill="#BA9B37">Board = project &#183; List = workflow stage &#183; Card = task</text>

  <!-- Board outline -->
  <rect x="30" y="95" width="940" height="440" rx="10" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="50" y="90" font-size="15" font-weight="700" fill="#000000">Board: "Course Project"</text>

  <!-- 3 lists -->
  <!-- To Do -->
  <rect x="55" y="120" width="280" height="390" rx="8" fill="#F4F4F4" stroke="#000000" stroke-width="1.5"/>
  <rect x="55" y="120" width="280" height="40" rx="8" fill="#000000"/>
  <text x="195" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#FFC904">To Do</text>

  <rect x="72" y="175" width="246" height="70" rx="6" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2"/>
  <text x="86" y="200" font-size="14" fill="#000000">Week 3 pre-lecture reading</text>
  <text x="86" y="220" font-size="12" fill="#BA9B37">due Fri &#8226; unstarted</text>

  <rect x="72" y="255" width="246" height="70" rx="6" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2"/>
  <text x="86" y="280" font-size="14" fill="#000000">Design the class diagram</text>
  <text x="86" y="300" font-size="12" fill="#BA9B37">no due date</text>

  <!-- Doing -->
  <rect x="360" y="120" width="280" height="390" rx="8" fill="#F4F4F4" stroke="#000000" stroke-width="1.5"/>
  <rect x="360" y="120" width="280" height="40" rx="8" fill="#000000"/>
  <text x="500" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#FFC904">Doing</text>

  <rect x="377" y="175" width="246" height="90" rx="6" fill="#FFFFFF" stroke="#FFC904" stroke-width="3"/>
  <text x="391" y="198" font-size="14" fill="#000000">Implement use case diagram</text>
  <text x="391" y="218" font-size="12" fill="#B00020">overdue!</text>
  <rect x="391" y="228" width="150" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="391" y="228" width="90" height="8" rx="4" fill="#FFC904"/>
  <text x="391" y="250" font-size="11" fill="#000000">checklist: 3 / 5 done</text>

  <!-- Done -->
  <rect x="665" y="120" width="280" height="390" rx="8" fill="#F4F4F4" stroke="#000000" stroke-width="1.5"/>
  <rect x="665" y="120" width="280" height="40" rx="8" fill="#000000"/>
  <text x="805" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#FFC904">Done</text>

  <rect x="682" y="175" width="246" height="60" rx="6" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2" opacity="0.85"/>
  <text x="696" y="210" font-size="14" fill="#000000">Week 1 pre-lecture reading</text>

  <rect x="682" y="245" width="246" height="60" rx="6" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2" opacity="0.85"/>
  <text x="696" y="280" font-size="14" fill="#000000">Contribute to class blog</text>

  <!-- movement arrow -->
  <defs>
    <marker id="mv" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
  </defs>
  <path d="M 335 400 C 400 440, 320 460, 358 400" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#mv)"/>
  <text x="345" y="480" font-size="13" fill="#000000" text-anchor="middle">cards move left &#8594; right as work progresses</text>
</svg>
