<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="480" fill="#FFFFFF"/>
  <text x="450" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#000000">Anatomy of a UML Class</text>

  <!-- class box: 3 compartments -->
  <g>
    <rect x="300" y="80" width="300" height="300" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
    <!-- name compartment -->
    <rect x="300" y="80" width="300" height="50" fill="#000000"/>
    <text x="450" y="113" text-anchor="middle" font-size="20" font-weight="700" fill="#FFC904">Animal</text>
    <!-- divider -->
    <line x1="300" y1="130" x2="600" y2="130" stroke="#000000" stroke-width="2"/>

    <!-- attributes compartment -->
    <text x="315" y="158" font-size="15" fill="#000000">- name : String</text>
    <text x="315" y="182" font-size="15" fill="#000000">- age : int</text>
    <text x="315" y="206" font-size="15" fill="#000000">- species : String</text>
    <line x1="300" y1="225" x2="600" y2="225" stroke="#000000" stroke-width="2"/>

    <!-- methods compartment -->
    <text x="315" y="253" font-size="15" fill="#000000">+ eat() : void</text>
    <text x="315" y="277" font-size="15" fill="#000000">+ sleep() : void</text>
    <text x="315" y="301" font-size="15" fill="#000000">+ makeSound() : String</text>
    <text x="315" y="325" font-size="15" fill="#000000"># validate() : void</text>
  </g>

  <!-- callouts -->
  <g font-size="14" fill="#BA9B37">
    <text x="640" y="108">&#8592; class name</text>
    <text x="640" y="180">&#8592; attributes</text>
    <text x="640" y="285">&#8592; methods / behavior</text>
  </g>

  <!-- visibility legend -->
  <g font-size="15" fill="#000000">
    <text x="70" y="410" font-weight="700">Visibility:</text>
    <text x="70" y="435">+ public &#160;&#160;&#160; &#8722; private &#160;&#160;&#160; # protected</text>
  </g>
  <text x="450" y="460" text-anchor="middle" font-size="14" fill="#BA9B37" font-style="italic">Every object created from this class shares this same structure and behavior</text>
</svg>
