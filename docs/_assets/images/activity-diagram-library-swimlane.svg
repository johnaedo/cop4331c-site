<svg viewBox="0 0 1000 930" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="930" fill="#FFFFFF"/>
  <text x="500" y="36" text-anchor="middle" font-size="26" font-weight="700" fill="#000000">Activity Diagram with Swimlanes &#8212; Library Book Loan</text>

  <defs>
    <marker id="lArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- swimlanes -->
  <rect x="40" y="70" width="460" height="780" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect x="500" y="70" width="460" height="780" fill="#F7F7F7" stroke="#000000" stroke-width="2"/>
  <rect x="40" y="70" width="460" height="40" fill="#000000"/>
  <rect x="500" y="70" width="460" height="40" fill="#000000"/>
  <text x="270" y="97" text-anchor="middle" font-size="17" font-weight="700" fill="#FFC904">Member</text>
  <text x="730" y="97" text-anchor="middle" font-size="17" font-weight="700" fill="#FFC904">Librarian</text>

  <!-- start -->
  <circle cx="270" cy="140" r="13" fill="#000000"/>
  <line x1="270" y1="153" x2="270" y2="185" stroke="#000000" stroke-width="2" marker-end="url(#lArrow)"/>

  <!-- decision -->
  <polygon points="270,190 330,230 270,270 210,230" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="270" y="234" text-anchor="middle" font-size="12" fill="#000000">member?</text>

  <text x="140" y="220" font-size="13" fill="#000000">[borrower]</text>
  <text x="360" y="220" font-size="13" fill="#000000">[returner]</text>

  <!-- Borrower path -->
  <line x1="210" y1="230" x2="150" y2="230" stroke="#000000" stroke-width="2"/>
  <line x1="150" y1="230" x2="150" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#lArrow)"/>
  <rect x="60" y="295" width="180" height="55" rx="27" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
  <text x="150" y="328" text-anchor="middle" font-size="14" fill="#000000">Find book on shelf</text>

  <!-- Returner path -->
  <line x1="330" y1="230" x2="390" y2="230" stroke="#000000" stroke-width="2"/>
  <line x1="390" y1="230" x2="390" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#lArrow)"/>

  <!-- merge into "wait in queue" -->
  <line x1="150" y1="350" x2="150" y2="390" stroke="#000000" stroke-width="2"/>
  <line x1="150" y1="390" x2="260" y2="390" stroke="#000000" stroke-width="2"/>
  <line x1="390" y1="290" x2="390" y2="390" stroke="#000000" stroke-width="2"/>
  <line x1="390" y1="390" x2="280" y2="390" stroke="#000000" stroke-width="2"/>
  <line x1="270" y1="390" x2="270" y2="420" stroke="#000000" stroke-width="2" marker-end="url(#lArrow)"/>

  <rect x="170" y="425" width="200" height="55" rx="27" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
  <text x="270" y="458" text-anchor="middle" font-size="14" fill="#000000">Wait in queue</text>

  <!-- crosses lane to Librarian -->
  <line x1="270" y1="480" x2="270" y2="520" stroke="#000000" stroke-width="2"/>
  <line x1="270" y1="520" x2="730" y2="520" stroke="#000000" stroke-width="2" marker-end="url(#lArrow)"/>
  <text x="500" y="510" text-anchor="middle" font-size="12" fill="#BA9B37" font-style="italic">transitions may cross lanes</text>

  <!-- decision on librarian side: borrowing or returning -->
  <polygon points="730,525 790,565 730,605 670,565" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="730" y="569" text-anchor="middle" font-size="11" fill="#000000">action?</text>
  <text x="600" y="555" font-size="13" fill="#000000">[borrowing]</text>
  <text x="800" y="555" font-size="13" fill="#000000">[returning]</text>

  <rect x="560" y="625" width="180" height="55" rx="27" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
  <text x="650" y="658" text-anchor="middle" font-size="14" fill="#000000">Record borrowing</text>
  <line x1="700" y1="600" x2="650" y2="622" stroke="#000000" stroke-width="2" marker-end="url(#lArrow)"/>

  <rect x="780" y="625" width="160" height="55" rx="27" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
  <text x="860" y="658" text-anchor="middle" font-size="14" fill="#000000">Record return</text>
  <line x1="760" y1="600" x2="850" y2="622" stroke="#000000" stroke-width="2" marker-end="url(#lArrow)"/>

  <rect x="780" y="700" width="160" height="55" rx="27" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
  <text x="860" y="733" text-anchor="middle" font-size="13" fill="#000000">Put book back</text>
  <text x="860" y="748" text-anchor="middle" font-size="11" fill="#000000">on shelf</text>
  <line x1="860" y1="680" x2="860" y2="698" stroke="#000000" stroke-width="2" marker-end="url(#lArrow)"/>

  <!-- merge to prepare next member -->
  <line x1="650" y1="680" x2="650" y2="800" stroke="#000000" stroke-width="2"/>
  <line x1="650" y1="800" x2="720" y2="800" stroke="#000000" stroke-width="2"/>
  <line x1="860" y1="755" x2="860" y2="800" stroke="#000000" stroke-width="2"/>
  <line x1="860" y1="800" x2="740" y2="800" stroke="#000000" stroke-width="2"/>
  <line x1="730" y1="800" x2="730" y2="815" stroke="#000000" stroke-width="2" marker-end="url(#lArrow)"/>

  <rect x="630" y="818" width="200" height="50" rx="25" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
  <text x="730" y="848" text-anchor="middle" font-size="13" fill="#000000">Prepare for next member</text>

  <line x1="730" y1="868" x2="730" y2="868" stroke="#000000" stroke-width="2"/>
  <circle cx="730" cy="885" r="15" fill="none" stroke="#000000" stroke-width="2.5"/>
  <circle cx="730" cy="885" r="8" fill="#000000"/>
</svg>
