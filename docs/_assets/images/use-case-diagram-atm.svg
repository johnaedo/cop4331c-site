<svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1100" height="620" fill="#FFFFFF"/>
  <text x="550" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#000000">Use Case Diagram &#8212; ATM System</text>

  <!-- System boundary -->
  <rect x="270" y="70" width="580" height="500" rx="8" fill="none" stroke="#000000" stroke-width="3"/>
  <text x="560" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#000000">ATM System (boundary)</text>

  <!-- Use case ellipses -->
  <g font-size="15" fill="#000000">
    <ellipse cx="450" cy="150" rx="105" ry="34" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
    <text x="450" y="155" text-anchor="middle">Insert Card</text>

    <ellipse cx="650" cy="150" rx="105" ry="34" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
    <text x="650" y="155" text-anchor="middle">Enter PIN</text>

    <ellipse cx="450" cy="280" rx="115" ry="34" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
    <text x="450" y="285" text-anchor="middle">Check Balance</text>

    <ellipse cx="650" cy="280" rx="115" ry="34" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
    <text x="650" y="285" text-anchor="middle">Withdraw Money</text>

    <ellipse cx="450" cy="400" rx="115" ry="34" fill="#FFFFFF" stroke="#BA9B37" stroke-width="2.5"/>
    <text x="450" y="405" text-anchor="middle">Deposit Money</text>

    <ellipse cx="680" cy="470" rx="130" ry="36" fill="#FFF7DA" stroke="#FFC904" stroke-width="2.5"/>
    <text x="680" y="466" text-anchor="middle">Exceeded Try</text>
    <text x="680" y="484" text-anchor="middle">Count</text>
  </g>

  <!-- Actors: outside the boundary -->
  <!-- Customer left -->
  <g stroke="#000000" stroke-width="2.5" fill="none">
    <circle cx="110" cy="220" r="18" fill="#FFFFFF"/>
    <line x1="110" y1="238" x2="110" y2="300"/>
    <line x1="75" y1="260" x2="145" y2="260"/>
    <line x1="110" y1="300" x2="80" y2="345"/>
    <line x1="110" y1="300" x2="140" y2="345"/>
  </g>
  <text x="110" y="375" text-anchor="middle" font-size="16" font-weight="700" fill="#000000">Customer</text>

  <!-- Bank (actor / external system) right -->
  <g stroke="#000000" stroke-width="2.5" fill="none">
    <circle cx="990" cy="220" r="18" fill="#FFFFFF"/>
    <line x1="990" y1="238" x2="990" y2="300"/>
    <line x1="955" y1="260" x2="1025" y2="260"/>
    <line x1="990" y1="300" x2="960" y2="345"/>
    <line x1="990" y1="300" x2="1020" y2="345"/>
  </g>
  <text x="990" y="375" text-anchor="middle" font-size="16" font-weight="700" fill="#000000">Bank Server</text>
  <text x="990" y="393" text-anchor="middle" font-size="12" fill="#BA9B37">(a non-human actor)</text>

  <!-- associations actor-use case -->
  <g stroke="#000000" stroke-width="1.5">
    <line x1="145" y1="230" x2="345" y2="150"/>
    <line x1="145" y1="250" x2="335" y2="280"/>
    <line x1="145" y1="270" x2="335" y2="400"/>
    <line x1="955" y1="230" x2="758" y2="150"/>
    <line x1="955" y1="255" x2="765" y2="280"/>
  </g>

  <!-- include relationships -->
  <defs>
    <marker id="incArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
  </defs>
  <g stroke="#000000" stroke-width="2" stroke-dasharray="6,4" fill="none">
    <line x1="555" y1="150" x2="545" y2="150" marker-end="url(#incArrow)"/>
    <line x1="565" y1="280" x2="565" y2="184" marker-end="url(#incArrow)"/>
  </g>
  <text x="600" y="140" text-anchor="middle" font-size="12" fill="#000000" font-style="italic">&#171;include&#187;</text>
  <text x="600" y="230" text-anchor="middle" font-size="12" fill="#000000" font-style="italic">&#171;include&#187;</text>

  <!-- extend relationship -->
  <path d="M 630 448 C 610 400, 660 340, 655 316" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#incArrow)"/>
  <text x="720" y="410" text-anchor="middle" font-size="12" fill="#000000" font-style="italic">&#171;extend&#187;</text>

  <text x="550" y="600" text-anchor="middle" font-size="14" fill="#BA9B37" font-style="italic">Actors stay outside the boundary &#8226; use cases (ellipses) live inside &#8226; &#171;include&#187;/&#171;extend&#187; link related use cases</text>
</svg>
